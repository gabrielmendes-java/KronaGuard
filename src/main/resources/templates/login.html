<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | Krona Guard</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

<div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-slate-200">

    <!-- Marca -->
    <div class="px-6 pt-6 text-center">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">
            Krona Guard
        </span>
    </div>

    <!-- Cabeçalho -->
    <div class="bg-slate-900 text-white p-6 mt-4">

        <span class="text-xs uppercase tracking-wider font-semibold text-slate-400">
            Painel do Técnico
        </span>

        <h1 class="text-2xl font-bold mt-1">
            Entrar
        </h1>

        <p class="text-slate-400 text-sm mt-1">
            Acesse sua conta para gerenciar suas garantias.
        </p>

    </div>

    <!-- Formulário -->
    <form th:action="@{/login}" method="post" class="p-6 space-y-5">

        <!-- Erro de login -->
        <div th:if="${param.error}"
             class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl px-4 py-3">
            E-mail ou senha incorretos.
        </div>

        <!-- Logout -->
        <div th:if="${param.logout}"
             class="bg-green-50 border border-green-200 text-green-600 text-sm rounded-xl px-4 py-3">
            Você saiu da sua conta.
        </div>

        <!-- E-mail -->
        <div>

            <label for="username"
                   class="block text-xs font-semibold text-slate-600 uppercase mb-1">
                E-mail
            </label>

            <input
                    type="email"
                    id="username"
                    name="username"
                    required
                    autocomplete="email"
                    placeholder="seuemail@exemplo.com"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300
                           focus:ring-2 focus:ring-slate-900 focus:outline-none
                           text-slate-800 text-sm">

        </div>

        <!-- Senha -->
        <div>

            <div class="flex justify-between items-center mb-1">

                <label for="password"
                       class="block text-xs font-semibold text-slate-600 uppercase">
                    Senha
                </label>

            </div>

            <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                    placeholder="Digite sua senha"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300
                           focus:ring-2 focus:ring-slate-900 focus:outline-none
                           text-slate-800 text-sm">

        </div>

        <!-- Botão -->
        <div class="pt-2">

            <button
                    type="submit"
                    class="w-full bg-slate-900 hover:bg-slate-800
                           text-white font-semibold py-3 rounded-xl
                           transition duration-200
                           shadow-lg shadow-slate-900/10 text-center">

                Entrar no painel

            </button>

        </div>

        <div class="text-center pt-2">
            <p class="text-sm text-slate-500">
                Ainda não tem uma conta?
                <a href="/cadastro"
                   class="font-semibold text-slate-900 hover:text-slate-700 transition">
                    Criar conta
                </a>
            </p>
        </div>

    </form>

    <!-- Rodapé -->
    <div class="bg-slate-50 px-6 py-4 border-t border-slate-100 text-center">

        <p class="text-xs text-slate-400">
            Krona Guard
        </p>

        <p class="text-xs text-slate-400 mt-1">
            Gestão simples de garantias para assistências técnicas.
        </p>

    </div>

</div>

</body>
</html>
