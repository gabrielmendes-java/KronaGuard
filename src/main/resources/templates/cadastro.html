<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | Krona Guard</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

<div class="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden border border-slate-200">

    <!-- Marca -->
    <div class="px-6 pt-6 flex justify-between items-center">

        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">
            Krona Guard
        </span>

        <a href="/login"
           class="text-xs font-semibold text-slate-600 hover:text-slate-900 transition">
            Já tenho uma conta
        </a>

    </div>

    <!-- Cabeçalho -->
    <div class="bg-slate-900 text-white p-6 mt-4">

        <span class="text-xs uppercase tracking-wider font-semibold text-slate-400">
            Área do Técnico
        </span>

        <h1 class="text-2xl font-bold mt-1">
            Criar sua conta
        </h1>

        <p class="text-slate-400 text-sm mt-1">
            Comece a gerenciar suas garantias de forma simples e profissional.
        </p>

    </div>

    <!-- Formulário -->
    <form th:action="@{/cadastro}"
          th:object="${usuario}"
          method="post"
          class="p-6 space-y-4">

        <!-- Erro geral -->
        <div th:if="${erro}"
             class="bg-red-50 border border-red-200 text-red-600
                    text-sm rounded-xl px-4 py-3">

            <span th:text="${erro}">
                Ocorreu um erro.
            </span>

        </div>

        <!-- Nome -->
        <div>

            <label for="nome"
                   class="block text-xs font-semibold text-slate-600 uppercase mb-1">
                Nome
            </label>

            <input
                    id="nome"
                    type="text"
                    th:field="*{nome}"
                    required
                    autocomplete="name"
                    placeholder="Ex: João da Silva"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300
                           focus:ring-2 focus:ring-slate-900 focus:outline-none
                           text-slate-800 text-sm">

            <p th:if="${#fields.hasErrors('nome')}"
               th:errors="*{nome}"
               class="text-red-500 text-xs mt-1 font-medium">
            </p>

        </div>

        <!-- E-mail -->
        <div>

            <label for="email"
                   class="block text-xs font-semibold text-slate-600 uppercase mb-1">
                E-mail
            </label>

            <input
                    id="email"
                    type="email"
                    th:field="*{email}"
                    required
                    autocomplete="email"
                    placeholder="seuemail@exemplo.com"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300
                           focus:ring-2 focus:ring-slate-900 focus:outline-none
                           text-slate-800 text-sm">

            <p th:if="${#fields.hasErrors('email')}"
               th:errors="*{email}"
               class="text-red-500 text-xs mt-1 font-medium">
            </p>

        </div>

        <!-- Senha -->
        <div>

            <label for="senha"
                   class="block text-xs font-semibold text-slate-600 uppercase mb-1">
                Senha
            </label>

            <input
                    id="senha"
                    type="password"
                    th:field="*{senha}"
                    required
                    minlength="6"
                    autocomplete="new-password"
                    placeholder="Mínimo de 6 caracteres"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300
                           focus:ring-2 focus:ring-slate-900 focus:outline-none
                           text-slate-800 text-sm">

            <p th:if="${#fields.hasErrors('senha')}"
               th:errors="*{senha}"
               class="text-red-500 text-xs mt-1 font-medium">
            </p>

        </div>

        <!-- Confirmar senha -->
        <div>

            <label for="confirmarSenha"
                   class="block text-xs font-semibold text-slate-600 uppercase mb-1">
                Confirmar senha
            </label>

            <input
                    id="confirmarSenha"
                    type="password"
                    name="confirmarSenha"
                    required
                    minlength="6"
                    autocomplete="new-password"
                    placeholder="Digite a senha novamente"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300
                           focus:ring-2 focus:ring-slate-900 focus:outline-none
                           text-slate-800 text-sm">

            <p id="erroSenha"
               class="text-red-500 text-xs mt-1 font-medium hidden">
                As senhas não coincidem.
            </p>

        </div>

        <!-- Botão -->
        <div class="pt-4">

            <button
                    id="botaoCadastro"
                    type="submit"
                    class="w-full bg-slate-900 hover:bg-slate-800
                           text-white font-semibold py-3 rounded-xl
                           transition duration-200
                           shadow-lg shadow-slate-900/10 text-center">

                Criar minha conta

            </button>

        </div>

    </form>

    <!-- Rodapé -->
    <div class="bg-slate-50 px-6 py-4 border-t border-slate-100 text-center">

        <p class="text-xs text-slate-400">
            Krona Guard
        </p>

        <p class="text-xs text-slate-400 mt-1">
            Gestão de garantias para assistências técnicas.
        </p>

    </div>

</div>

<script>

    const senha = document.getElementById("senha");
    const confirmarSenha = document.getElementById("confirmarSenha");
    const erroSenha = document.getElementById("erroSenha");
    const formulario = document.querySelector("form");

    function verificarSenhas() {

        if (confirmarSenha.value === "") {
            erroSenha.classList.add("hidden");
            return;
        }

        if (senha.value !== confirmarSenha.value) {
            erroSenha.classList.remove("hidden");
        } else {
            erroSenha.classList.add("hidden");
        }
    }

    senha.addEventListener("input", verificarSenhas);
    confirmarSenha.addEventListener("input", verificarSenhas);

    formulario.addEventListener("submit", function (event) {

        if (senha.value !== confirmarSenha.value) {

            event.preventDefault();

            erroSenha.classList.remove("hidden");

            confirmarSenha.focus();
        }

    });

</script>

</body>

</html>
