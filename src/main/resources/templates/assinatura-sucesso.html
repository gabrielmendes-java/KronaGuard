<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assinatura realizada | Krona Guard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

<div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-slate-200 overflow-hidden">

    <div class="p-8 text-center">

        <div class="mx-auto w-16 h-16 rounded-full bg-emerald-100 flex items-center justify-center">

            <span class="text-3xl text-emerald-600">
                ✓
            </span>

        </div>


        <h1 class="text-2xl font-bold text-slate-900 mt-6">
            Assinatura realizada!
        </h1>


        <p class="text-sm text-slate-500 mt-3 leading-relaxed">
            Seu pagamento foi processado com sucesso.
            Agora você pode aproveitar todos os recursos do Krona Guard.
        </p>


        <div class="bg-emerald-50 border border-emerald-100 rounded-xl p-4 mt-6">

            <p class="text-xs text-emerald-700 font-medium">
                Sua assinatura está ativa.
            </p>

        </div>


        <a href="/garantias"
           class="block w-full mt-6 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl transition">

            Ir para o painel

        </a>


        <a href="/"
           class="block mt-4 text-sm text-slate-500 hover:text-slate-800 transition">

            Voltar para o início

        </a>

    </div>


    <div class="bg-slate-50 px-6 py-4 border-t border-slate-100 text-center">

        <p class="text-xs text-slate-400">
            Krona Guard &bull; Pagamento seguro
        </p>

    </div>

</div>

</body>
</html>
