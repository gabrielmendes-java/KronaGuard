<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Mal Uso | Garantia Fácil</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

<div class="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden border border-slate-200">

    <div class="px-6 pt-6 flex justify-between items-center">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Garantia Fácil</span>
        <a th:href="@{/g/{codigo}(codigo=${codigo})}" class="text-xs font-semibold text-slate-600 hover:text-slate-900 transition flex items-center gap-1">
            &larr; Voltar ao Comprovante
        </a>
    </div>

    <div class="bg-red-700 text-white p-6 mt-4">
        <span class="text-xs uppercase tracking-wider font-semibold text-red-200">Painel do Técnico</span>
        <h1 class="text-2xl font-bold mt-1">Anular por Mal Uso</h1>
        <p class="text-red-100 text-sm mt-1">Esta ação registrará o cancelamento da garantia com base em evidências técnicas.</p>
    </div>

    <form th:action="@{/g/{codigo}/mal-uso(codigo=${codigo})}" method="post" class="p-6 space-y-4">

        <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Código da Garantia</label>
            <input type="text" th:value="${codigo}" disabled
                   class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-500 text-sm font-mono">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Motivo / Descrição do Dano</label>
            <textarea name="observacao" required rows="4"
                      placeholder="Ex: Aparelho apresenta oxidação severa na placa principal e vestígios de líquido, constatado violação do selo interno..."
                      class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-red-600 focus:outline-none text-slate-800 text-sm"></textarea>
            <p class="text-xs text-slate-400 mt-1">Este texto aparecerá publicamente no comprovante do cliente para total transparência.</p>
        </div>

        <div class="pt-4 flex gap-3">
            <a th:href="@{/g/{codigo}(codigo=${codigo})}"
               class="w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded-xl transition duration-200 text-center text-sm flex items-center justify-center">
                Cancelar
            </a>
            <button type="submit"
                    onclick="return confirm('Tem certeza absoluta? Essa alteração ficará registrada no comprovante.');"
                    class="w-2/3 bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-red-600/10 text-center text-sm">
                Confirmar Anulação
            </button>
        </div>

    </form>

    <div class="bg-slate-50 px-6 py-4 border-t border-slate-100 text-center">
        <p class="text-xs text-slate-400">Garantia Fácil</p>
    </div>

</div>

</body>
</html>
