<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Garantias | Krona Guard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 sm:p-8">

<div class="max-w-5xl mx-auto space-y-6">
    <div class="flex justify-between items-center">

    <a href="/home"
       class="text-xs font-bold text-slate-400 uppercase tracking-wider">
        Krona Guard | Home
    </a>

        <form th:action="@{/logout}" method="post">
            <button type="submit"
                    class="text-xs font-semibold text-slate-600 hover:text-red-600 transition">
                Sair
            </button>
        </form>

    </div>

    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
            <span class="text-xs uppercase tracking-wider font-semibold text-slate-400">Painel do Técnico</span>
            <h1 class="text-2xl font-bold text-slate-800 mt-1">Histórico de Garantias</h1>
            <p class="text-slate-500 text-sm">Visualize e gerencie todos os atendimentos cadastrados.</p>
        </div>
        <div>
            <a href="/nova-garantia"
               class="inline-block bg-slate-900 hover:bg-slate-800 text-white font-semibold px-5 py-2.5 rounded-xl transition duration-200 text-sm shadow-md shadow-slate-900/10">
                + Nova Garantia
            </a>
        </div>
    </div>


    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <form action="/garantias" method="get" class="flex flex-col sm:flex-row gap-2">
            <input type="text" name="termo" th:value="${termo}"
                   placeholder="Pesquisar por nome do cliente ou CPF..."
                   class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-slate-900 focus:outline-none text-sm text-slate-800">
            <div class="flex gap-2">
                <button type="submit" class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition shrink-0">
                    Buscar
                </button>
                <a href="/garantias" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center transition shrink-0">
                    Limpar
                </a>
            </div>
        </form>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-xs uppercase font-semibold text-slate-500 tracking-wider">
                    <th class="p-4">Código</th>
                    <th class="p-4">Cliente</th>
                    <th class="p-4">CPF</th>
                    <th class="p-4">Aparelho</th>
                    <th class="p-4">Validade</th>
                    <th class="p-4 text-center">Ação</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-sm">
                <tr th:each="g : ${garantias}" class="hover:bg-slate-50/80 transition">
                    <td class="p-4 font-mono font-bold text-slate-600" th:text="${g.codigoGarantia}">GAR-00000</td>
                    <td class="p-4 font-semibold text-slate-800" th:text="${g.clienteNome}">Nome do Cliente</td>
                    <td class="p-4 text-slate-600" th:text="${g.cpf}">000.000.000-00</td>
                    <td class="p-4 text-slate-600" th:text="${g.aparelho}">Modelo do Aparelho</td>
                    <td class="p-4 text-slate-600" th:text="${g.dataValidade}">00/00/0000</td>
                    <td class="p-4 text-center">
                        <a th:href="@{/g/{codigo}(codigo=${g.codigoGarantia})}" target="_blank"
                           class="inline-block bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-1.5 rounded-lg text-xs transition">
                            Ver Comprovante
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(garantias)}">
                    <td colspan="6" class="p-8 text-center text-slate-400">
                        Nenhuma garantia encontrada.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
